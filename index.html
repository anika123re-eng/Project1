<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11152b">
  <meta name="description" content="A little hello from the internet.">
  <title>Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; overflow: hidden; color: #f7f7ff; background: #101326; }
    .scene { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 18% 15%, #34245f 0, transparent 40%), radial-gradient(ellipse at 85% 80%, #123d5c 0, transparent 42%), linear-gradient(135deg, #11152b, #171b35 55%, #101326); }
    .orb { position: absolute; border-radius: 50%; filter: blur(1px); opacity: .65; animation: drift 12s ease-in-out infinite alternate; }
    .orb.one { width: 300px; height: 300px; left: -90px; top: 48%; background: radial-gradient(circle at 35% 35%, #a78bfa, #6d4de2 45%, transparent 72%); }
    .orb.two { width: 380px; height: 380px; right: -110px; top: -100px; background: radial-gradient(circle at 40% 45%, #5eead4, #198fa5 45%, transparent 72%); animation-delay: -4s; }
    .orb.three { width: 220px; height: 220px; right: 18%; bottom: -110px; background: radial-gradient(circle at 40% 40%, #fb7185, #a73573 48%, transparent 72%); animation-delay: -7s; }
    .grid { position: absolute; inset: 0; opacity: .15; background-image: linear-gradient(#aab3ff 1px, transparent 1px), linear-gradient(90deg, #aab3ff 1px, transparent 1px); background-size: 58px 58px; mask-image: linear-gradient(to bottom, transparent, black 35%, black 75%, transparent); }
    main { position: relative; width: min(90vw, 760px); padding: clamp(2rem, 7vw, 5rem); text-align: center; border: 1px solid rgb(255 255 255 / .17); border-radius: 32px; background: rgb(18 22 44 / .58); box-shadow: 0 30px 100px rgb(0 0 0 / .35), inset 0 1px rgb(255 255 255 / .12); backdrop-filter: blur(24px); animation: arrive .9s cubic-bezier(.2,.8,.2,1) both; }
    .spark { display: inline-grid; place-items: center; width: 58px; height: 58px; margin-bottom: 1.5rem; border: 1px solid rgb(255 255 255 / .2); border-radius: 18px; color: #fff; font-size: 1.6rem; background: linear-gradient(145deg, rgb(167 139 250 / .38), rgb(94 234 212 / .2)); box-shadow: 0 8px 30px rgb(128 110 255 / .2); }
    .eyebrow { margin: 0 0 .8rem; color: #a5f3e7; font-size: .76rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.2rem, 10vw, 6.7rem); line-height: .98; letter-spacing: -.075em; font-weight: 800; background: linear-gradient(110deg, #fff 15%, #c4b5fd 52%, #99f6e4 92%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { max-width: 34rem; margin: 1.35rem auto 0; color: #c4c8dc; font-size: clamp(1rem, 2.4vw, 1.2rem); line-height: 1.7; }
    .badge { display: inline-flex; align-items: center; gap: .55rem; margin-top: 2rem; padding: .65rem 1rem; border: 1px solid rgb(255 255 255 / .13); border-radius: 999px; color: #e5e7f5; font-size: .85rem; background: rgb(255 255 255 / .055); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #5eead4; box-shadow: 0 0 14px #5eead4; }
    footer { position: fixed; inset: auto 0 1.25rem; color: rgb(226 232 255 / .5); text-align: center; font-size: .75rem; letter-spacing: .08em; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translate3d(22px, -18px, 0) scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"><div class="grid"></div><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div></div>
  <main>
    <div class="spark" aria-hidden="true">✦</div>
    <div class="eyebrow">A tiny page with big energy</div>
    <h1>Hello,<br>World!</h1>
    <p>One small message, wrapped in a little wonder. Here’s to all the bright things you’ll build next.</p>
    <div class="badge"><span class="dot" aria-hidden="true"></span> All systems curious</div>
  </main>
  <footer>MADE OF HTML, CSS &amp; A LITTLE MAGIC</footer>
</body>
</html>
